<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Welcome to hat closet</title>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Redaction+50:ital,wght@0,400;0,700;1,400&family=Tiny5&display=swap" rel="stylesheet">
		<!-- import the webpage's stylesheet -->
		<link rel="stylesheet" href="styles.css" />
		<!-- import the webpage's JavaScript file -->
		<script src="script.js" defer></script>
	</head>

	<body>
		<div id="page">
			<h1>Stack hats on the blue human</h1>
			<div id="left-container" class="container">

				<div class="hat-holder">
					<img class="hat" alt="hat" id="hat1" src="./images/hat1.png" />
				</div>
				<div class="hat-holder">
					<img class="hat" alt="hat" id="hat2" src="./images/hat2.png" />
				</div>
				<div class="hat-holder">
					<img class="hat" alt="hat" id="hat3" src="./images/hat3.png" />
				</div>
				</div>
			</div>
			<div id="right-container" class="container">
				<div class="hat-holder">
					<img class="hat" alt="hat" id="hat4" src="./images/hat4.png" />
				</div>
				<div class="hat-holder">
					<img class="hat" alt="hat" id="hat5" src="./images/hat5.png" />
				</div>
				<div class="hat-holder">
					<img class="hat" alt="hat" id="hat6" src="./images/hat6.png" />
				</div>
			</div>

			<div id="terrarium">
				<div class="jar-top"></div>
				<div class="jar-walls">
					<div class="jar-glossy-long"></div>
					<div class="jar-glossy-short"></div>
				</div>
				<div class="dirt"></div>
				<div class="jar-bottom"></div>
			</div>

			<div class="greenroom">
				<img class="background" src="./images/fixedgreenroom.gif">
			</div>
			<div class="bluehuman">
            <img class="human" src="https://i.redd.it/6n5nw9xnw4yf1.png">
			</div>
			<img class="cursor" id="mous" src="./images/handcursor.png" />
		</div>
	
	</body>
</html>
